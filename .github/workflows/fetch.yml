name: Fetch Fuel Finder prices

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (off the hour: GitHub delays :00 jobs)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: fetch                # never two runs writing at once
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit the new data

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch prices
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
        run: python fetch.py
      - name: Commit data (also runs after a failed fetch, to keep the run log)
        if: always()
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Fuel data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
