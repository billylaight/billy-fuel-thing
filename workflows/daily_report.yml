name: Daily panel and QA report

on:
  schedule:
    - cron: "23 6 * * *"     # once a day, early morning
  workflow_dispatch:

concurrency:
  group: fetch                # waits for any running fetch to finish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build events, daily panel and QA report
        run: python fuel_finder_transform.py "data/events/*.csv" "data/snapshots/*_prices.csv.gz" --out out
      - name: Keep the daily panel as a downloadable file (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: daily-panel
          path: out/
      - name: Commit the QA report only (the panel can always be rebuilt)
        run: |
          mkdir -p reports
          cp out/qa_report.txt "reports/qa_$(date -u +%Y-%m-%d).txt"
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "QA report $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
